[project]
name = "armazem-ficcao-testes"
version = "1.0.0"
description = "Testes end-to-end do Armazém Ficção com Playwright para Python"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
test = [
  "pytest>=8.3",
  "pytest-playwright>=0.7",
  "pytest-html>=4.1",
  "pytest-xdist>=3.6",
  "axe-playwright-python>=0.1.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "smoke: caminho feliz mínimo, roda também contra produção",
  "a11y: verificações automáticas de acessibilidade (axe-core)",
]
